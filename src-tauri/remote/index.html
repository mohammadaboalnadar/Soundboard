<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151412" />
<title>Sonic Dominion remote</title>
<style>
@font-face { font-family: "Big Shoulders Display"; src: url(/font/stamp.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Schibsted Grotesk"; src: url(/font/ui.woff2) format("woff2"); font-weight: 400 900; font-display: swap; }
@font-face { font-family: "Martian Mono"; src: url(/font/mono.woff2) format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; font-display: swap; }
:root {
  color-scheme: dark;
  --font-stamp: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --font-ui: "Schibsted Grotesk", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, monospace;
  --paper: oklch(14.5% 0.004 70);
  --paper-2: oklch(17.5% 0.005 70);
  --paper-3: oklch(20.5% 0.006 70);
  --paper-5: oklch(28% 0.007 70);
  --well: oklch(11% 0.004 70);
  --groove: oklch(9% 0.003 70);
  --rule: oklch(27% 0.006 70);
  --rule-strong: oklch(36% 0.007 70);
  --ink: oklch(95% 0.004 140);
  --muted: oklch(79% 0.006 100);
  --neutral: oklch(66% 0.008 80);
  --label: oklch(95% 0.004 140);
  --label-ink: oklch(16% 0.005 70);
  --kraft: oklch(66% 0.075 70);
  --kraft-ink: oklch(24% 0.04 60);
  --accent: oklch(62% 0.205 28);
  --accent-ink: oklch(97% 0.004 140);
  --danger: oklch(64% 0.205 28);
  --led-amber: oklch(85% 0.165 92); --led-ember: oklch(72% 0.18 50); --led-rose: oklch(68% 0.2 358); --led-violet: oklch(62% 0.18 300);
  --led-azure: oklch(62% 0.17 255); --led-teal: oklch(74% 0.13 190); --led-moss: oklch(70% 0.17 148); --led-sand: oklch(82% 0.07 85);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.35 var(--font-ui); overflow-x: clip; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
.top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; background: var(--paper-2); border-bottom: 1px solid var(--rule); }
.mark { flex: 1; font-family: var(--font-stamp); font-weight: 900; letter-spacing: 0.04em; font-size: 20px; }
.stop { height: 40px; padding: 0 16px; border: 2px solid var(--accent); border-radius: 3px; background: transparent; color: var(--accent); font-family: var(--font-stamp); font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
.stop:active { background: var(--accent); color: var(--accent-ink); }
.stop i { display: none; }
.banks { display: flex; gap: 6px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.bank { flex: none; height: 38px; padding: 0 14px 0 8px; border: 0; border-radius: 3px 12px 3px 3px; background: var(--kraft); color: var(--kraft-ink); white-space: nowrap; font-family: var(--font-stamp); font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; display: flex; align-items: center; gap: 8px; }
.bank b { display: grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--kraft-ink); border-radius: 3px; font-weight: 900; }
.bank[aria-pressed="true"] { background: var(--label); color: var(--label-ink); }
.bank[aria-pressed="true"] b { border-color: var(--accent); color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 24px); }
.pad { min-width: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 14px; min-height: 88px; padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper-3); text-align: left; overflow: hidden; transition: transform 120ms var(--ease-out); }
.pad:active { transform: translateY(1px); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--ink); }
.disc { position: relative; width: 64px; height: 64px; border-radius: 50%; background: repeating-radial-gradient(circle, var(--groove) 0 1.2px, var(--paper-5) 1.2px 2.4px); }
.disc .label { position: absolute; inset: 22%; display: grid; place-items: center; border-radius: 50%; background: var(--label); }
.disc .label::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--groove); }
.disc .pip { position: absolute; right: -2px; bottom: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--led); box-shadow: 0 0 0 2px var(--paper-3); }
.pad .body { display: grid; gap: 4px; min-width: 0; }
.pad .name { font-family: var(--font-stamp); font-size: 22px; font-weight: 900; line-height: 0.95; text-transform: uppercase; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pad .foot { color: var(--accent); font: 700 12px var(--font-mono); font-stretch: 87.5%; }
.pad.playing { border-color: var(--accent); }
.pad.playing .label { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .pad.playing .label { animation: none; } }
.gate { display: grid; place-content: center; gap: 14px; min-height: 80svh; padding: 24px; text-align: center; }
.gate h1 { margin: 0; font-family: var(--font-stamp); font-size: 34px; font-weight: 900; letter-spacing: 0.04em; }
.gate p { margin: 0; color: var(--neutral); max-width: 32ch; }
.gate input { width: 100%; height: 52px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--well); color: var(--ink); font: 600 24px var(--font-mono); letter-spacing: 0.3em; text-align: center; }
.gate input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate .err { color: var(--danger); min-height: 1.3em; }
.gate button { height: 48px; border: 0; border-radius: 4px; background: var(--label); color: var(--label-ink); font-family: var(--font-stamp); font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
.empty { padding: 32px 16px; color: var(--neutral); }
.offline { padding: 8px 16px; background: var(--paper-2); color: var(--danger); font-size: 13px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const root = document.getElementById("root");
  let pin = "";
  try { pin = localStorage.getItem("sd.pin") || ""; } catch {}
  let state = null, bank = null, offline = false, timer = 0;

  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "style") n.setAttribute("style", v);
      else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };

  async function api(path, method = "GET") {
    const r = await fetch(path, { method, headers: { "X-Pin": pin }, signal: AbortSignal.timeout(4000) });
    if (r.status === 401) throw Object.assign(new Error("pin"), { pin: true });
    if (r.status === 429) throw Object.assign(new Error("locked"), { locked: true });
    if (!r.ok) throw new Error("http");
    return r.json();
  }

  function gate(msg = "") {
    clearTimeout(timer);
    const input = el("input", { inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", "aria-label": "PIN" });
    const err = el("p", { class: "err", role: "alert" }, msg);
    const go = async () => {
      pin = input.value.trim();
      try { await refresh(); try { localStorage.setItem("sd.pin", pin); } catch {} }
      catch (e) { err.textContent = e.pin ? "That PIN didn't match. Check Settings > Phone remote." : e.locked ? "Too many wrong PINs. Wait a minute, then try again." : "Can't reach Sonic Dominion."; }
    };
    input.addEventListener("keydown", (e) => e.key === "Enter" && go());
    root.replaceChildren(el("div", { class: "gate" },
      el("h1", {}, "SONIC DOMINION"),
      el("p", {}, "Enter the 6-digit PIN shown in Settings > Phone remote on your PC."),
      input, err, el("button", { onclick: go }, "Connect")));
    input.focus();
  }

  async function act(path) {
    try { await api(path, "POST"); setTimeout(refresh, 120); } catch (e) { if (e.pin) gate("PIN changed. Enter the new one."); }
  }

  function render() {
    const playing = new Set(state.playing || []);
    const banks = state.banks || [];
    if (bank === null || !banks.some((b) => b.id === bank)) bank = state.activeBank ?? (banks[0] ? banks[0].id : "");
    const sounds = (state.sounds || []).filter((s) => !banks.length || s.bank === bank);
    root.replaceChildren(...[
      el("div", { class: "top" }, el("span", { class: "mark" }, "SONIC DOMINION"),
        el("button", { class: "stop", onclick: () => act("/api/stopall") }, el("i"), "Stop all")),
      offline ? el("div", { class: "offline" }, "Connection lost. Retrying.") : null,
      banks.length ? el("div", { class: "banks" }, ...banks.map((b) => el("button", {
        class: "bank", "aria-pressed": String(b.id === bank),
        onclick: () => { bank = b.id; act("/api/bank?id=" + encodeURIComponent(b.id)); render(); }
      }, el("b", {}, b.letter), b.name))) : null,
      sounds.length ? el("div", { class: "grid" }, ...sounds.map((s) => el("button", {
        class: "pad" + (playing.has(s.id) ? " playing" : ""), style: "--led: var(--led-" + (s.color || "amber") + ")",
        onclick: () => act((playing.has(s.id) && s.mode !== "overlap" && s.mode !== "restart" ? "/api/stop?id=" : "/api/play?id=") + encodeURIComponent(s.id))
      }, el("span", { class: "disc", "aria-hidden": "true" }, el("span", { class: "label" }), el("span", { class: "pip" })), el("span", { class: "body" }, s.slot ? el("span", { class: "foot" }, "N" + s.slot) : null, el("span", { class: "name" }, s.name))))) : el("p", { class: "empty" }, "No sounds in this bank yet.")
    ].filter(Boolean));
  }

  async function refresh() {
    clearTimeout(timer);
    try { state = await api("/api/state"); offline = false; render(); }
    catch (e) { if (e.pin || e.locked) { if (state) gate(e.locked ? "Too many wrong PINs. Wait a minute." : "PIN changed. Enter the new one."); throw e; } offline = true; if (state) render(); }
    timer = setTimeout(() => { if (!document.hidden) refresh().catch(() => {}); }, 1500);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state) refresh().catch(() => {}); });

  if (pin) refresh().catch(() => gate()); else gate();
})();
</script>
</body>
</html>
