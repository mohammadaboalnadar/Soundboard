<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonic Dominion</title>
    <link rel="preload" href="fonts/BigShouldersDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/SchibstedGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/MartianMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
        <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="M10.25 10.25 13.5 13.5"/></symbol>
        <symbol id="i-grid" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></symbol>
        <symbol id="i-list" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
        <symbol id="i-board" viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11"/></symbol>
        <symbol id="i-all" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h6"/></symbol>
        <symbol id="i-mic" viewBox="0 0 16 16"><rect x="6" y="2.5" width="4" height="7" rx="2"/><path d="M3.75 7.75a4.25 4.25 0 0 0 8.5 0M8 12v1.75"/></symbol>
        <symbol id="i-headphones" viewBox="0 0 16 16"><path d="M3 10V8a5 5 0 0 1 10 0v2"/><rect x="2.5" y="9.5" width="2.75" height="4" rx="1"/><rect x="10.75" y="9.5" width="2.75" height="4" rx="1"/></symbol>
        <symbol id="i-cable" viewBox="0 0 16 16"><path d="M5 2.5v3M11 2.5v3M3.5 5.5h9v2.25a4.5 4.5 0 0 1-9 0zM8 12.25v1.25"/></symbol>
        <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.25a1 1 0 0 0 1 .75h3.8a1 1 0 0 0 1-.75l.6-8.25"/></symbol>
        <symbol id="i-key" viewBox="0 0 16 16"><rect x="1.75" y="4" width="12.5" height="8" rx="1.5"/><path d="M4.5 9.5h7"/></symbol>
        <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
        <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"/></symbol>
        <symbol id="i-moon" viewBox="0 0 16 16"><path d="M12.75 9.75A5 5 0 0 1 6.25 3.25a5 5 0 1 0 6.5 6.5z"/></symbol>
        <symbol id="i-gear" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><rect x="9" y="3" width="2.5" height="3" rx="0.75" fill="currentColor"/><rect x="4.5" y="6.5" width="2.5" height="3" rx="0.75" fill="currentColor"/><rect x="7.5" y="10" width="2.5" height="3" rx="0.75" fill="currentColor"/></symbol>
        <symbol id="i-compact" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><rect x="8.5" y="5" width="3.5" height="4.5" rx="0.75" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-star" viewBox="0 0 16 16"><path d="M8 2.25l1.8 3.66 4.03.59-2.92 2.84.69 4.02L8 11.46l-3.6 1.9.69-4.02L2.17 6.5l4.03-.59z"/></symbol>
        <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 16 16"><path d="M2.5 9.5h3l1 1.75h3l1-1.75h3M3.6 4.1 2.5 9.5v3a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3l-1.1-5.4a1 1 0 0 0-1-.85H4.6a1 1 0 0 0-1 .85z"/></symbol>
        <symbol id="i-record" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.75"/><circle cx="8" cy="8" r="2.75" fill="currentColor" stroke="none"/></symbol>
        <symbol id="m-restart" viewBox="0 0 16 16"><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2M3.5 2.75v2.5H6"/></symbol>
        <symbol id="m-overlap" viewBox="0 0 16 16"><rect x="2.5" y="5" width="7" height="7" rx="1"/><path d="M6.5 5V3.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H9.5"/></symbol>
        <symbol id="m-toggle" viewBox="0 0 16 16"><path d="M8 2.5v5M4.6 4.6a4.75 4.75 0 1 0 6.8 0"/></symbol>
        <symbol id="m-loop" viewBox="0 0 16 16"><path d="M11 3.5l2 2-2 2M13 5.5H5.5a3 3 0 0 0-3 3M5 12.5l-2-2 2-2M3 10.5h7.5a3 3 0 0 0 3-3"/></symbol>
        <symbol id="m-hold" viewBox="0 0 16 16"><path d="M8 2.5v7M5 6.5l3 3 3-3M3.5 13h9"/></symbol>
      </defs>
    </svg>

    <div class="app" id="app">
      <header class="transport" id="transport"></header>
      <nav class="rail" id="rail" aria-label="Boards"></nav>
      <main class="deck" id="deck"></main>
      <aside class="inspector" id="inspector" aria-label="Sound editor"></aside>
      <footer class="status" id="status"></footer>
    </div>

    <div class="drop-veil" id="drop-veil" hidden><p>Drop audio files to add them</p></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="menu-layer" id="menu-layer"></div>
    <dialog class="palette" id="palette" aria-label="Command palette"></dialog>
    <dialog class="sheet" id="settings" aria-label="Settings"></dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
